# =============================================================================
# TransformIQ — Docker Compose (Local Development)
# =============================================================================
# Usage:
#   docker compose up --build        # Start all services
#   docker compose up --build -d     # Start detached
#   docker compose down              # Stop all services
#   docker compose down -v           # Stop and remove volumes
# =============================================================================

services:

  # ---------------------------------------------------------------------------
  # PostgreSQL with pgvector extension
  # ---------------------------------------------------------------------------
  postgres:
    image: pgvector/pgvector:pg16
    container_name: transformiq-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-transformiq}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_DB: ${POSTGRES_DB:-transformiq}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-transformiq} -d ${POSTGRES_DB:-transformiq}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Redis (job queue and cache)
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: transformiq-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # ClamAV (local malware signature scanning — Phase 12D-A)
  # ---------------------------------------------------------------------------
  # Local-only malware scanning for source uploads. NO third-party upload or
  # scanning services. Runs an official ClamAV daemon on the internal Docker
  # network; the backend/worker talk to it over LOCALHOST of the stack only.
  clamav:
    image: clamav/clamav:stable
    container_name: transformiq-clamav
    environment:
      CLAMAV_NO_FRESHCLAMD: "false"
      # Official clamav/clamav images bind clamd's TCPSocket to 127.0.0.1 by
      # default. Bind to all interfaces so the backend/worker containers on
      # the compose network can reach clamd :3310.
      CLAMD_CONF_TCPAddr: "0.0.0.0"
    volumes:
      - clamav_data:/var/lib/clamav
    healthcheck:
      # clamd reports readiness as "PONG" (zero bytes length read).
      test: ["CMD-SHELL", "echo PING | nc -w 3 127.0.0.1 3310"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 120s
    deploy:
      resources:
        limits:
          memory: 1g
    restart: unless-stopped
    networks:
      default:
        # clamd listens on 3310 inside the compose network.
        aliases:
          - clamav

  # ---------------------------------------------------------------------------
  # Backend (FastAPI)
  # ---------------------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: transformiq-backend
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-transformiq}:${POSTGRES_PASSWORD:-changeme}@postgres:5432/${POSTGRES_DB:-transformiq}
      DATABASE_SYNC_URL: postgresql://${POSTGRES_USER:-transformiq}:${POSTGRES_PASSWORD:-changeme}@postgres:5432/${POSTGRES_DB:-transformiq}
      REDIS_URL: redis://redis:6379/0
      CLAMAV_HOST: ${CLAMAV_HOST:-clamav}
      CLAMAV_PORT: ${CLAMAV_PORT:-3310}
      CLAMAV_TIMEOUT_SECONDS: ${CLAMAV_TIMEOUT_SECONDS:-10}
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - backend_storage:/app/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      clamav:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Worker (RQ background processor)
  # ---------------------------------------------------------------------------
  worker:
    build:
      context: .
      dockerfile: worker/Dockerfile
    container_name: transformiq-worker
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-transformiq}:${POSTGRES_PASSWORD:-changeme}@postgres:5432/${POSTGRES_DB:-transformiq}
      DATABASE_SYNC_URL: postgresql://${POSTGRES_USER:-transformiq}:${POSTGRES_PASSWORD:-changeme}@postgres:5432/${POSTGRES_DB:-transformiq}
      REDIS_URL: redis://redis:6379/0
      CLAMAV_HOST: ${CLAMAV_HOST:-clamav}
      CLAMAV_PORT: ${CLAMAV_PORT:-3310}
      CLAMAV_TIMEOUT_SECONDS: ${CLAMAV_TIMEOUT_SECONDS:-10}
      PYTHONPATH: /backend:/app
    volumes:
      - ./worker:/app
      - ./backend:/backend
      - backend_storage:/app/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      clamav:
        condition: service_healthy
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Frontend (Next.js)
  # ---------------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: development
    container_name: transformiq-frontend
    env_file:
      - .env
    environment:
      # NEXT_PUBLIC_API_URL: browser-facing URL — set to the host where the
      # backend is accessible from the user's browser (default: localhost:8000).
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
      # INTERNAL_API_URL: server-to-server URL used for Next.js SSR requests
      # inside the Docker network.
      INTERNAL_API_URL: ${INTERNAL_API_URL:-http://backend:8000}
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

# =============================================================================
# Volumes
# =============================================================================
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  backend_storage:
    driver: local
  # Persistent ClamAV signature database (survives container restarts).
  clamav_data:
    driver: local
