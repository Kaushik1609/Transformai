# =============================================================================
# TransformIQ — Docker Compose MINIO Override (Phase 12A)
# =============================================================================
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.minio.yml up -d
#   docker compose -f docker-compose.yml -f docker-compose.minio.yml down -v
#
# Adds a local MinIO S3-compatible object store + an optional init bucket.
# The base stack is completely unaffected when this file is NOT loaded.
# =============================================================================

services:

  minio:
    image: minio/minio:latest
    container_name: transformiq-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-transformiq}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-transformiq-secret}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  minio-init:
    image: minio/mc:latest
    container_name: transformiq-minio-init
    entrypoint: >
      /bin/sh -c "
        mc alias set transformiq http://minio:9000 $${MINIO_ROOT_USER:-transformiq} $${MINIO_ROOT_PASSWORD:-transformiq-secret} > /dev/null 2>&1;
        mc mb --ignore-existing transformiq/transformiq > /dev/null 2>&1;
        echo 'MinIO bucket transformiq ready.'
      "
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-transformiq}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-transformiq-secret}
    depends_on:
      minio:
        condition: service_healthy
    restart: "no"

volumes:
  minio_data:
    driver: local
